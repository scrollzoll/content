name: Validate units

on:
  # ohne Pfadfilter: die Prüfung ist Pflicht-Check für main und muss bei jedem PR laufen
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
